name: Build image
# Builds the application image and pushes it to GitHub Container Registry.
# Runs for a version tag (v0.1.0) or by hand. It does not deploy.
# Every job in ci.yml runs first (checks, database and HTTP suites); the image is built only when all pass.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
permissions:
  contents: read
  packages: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/app.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repo }}/app:${{ steps.meta.outputs.tag }}
