# HilaTech Knowledge Studio on a single Docker host, next to another product.
# Lives in /opt/knowledge-studio on the host, with .env beside it (see env.example).
#
# Database credentials are split by who needs them (see env.example and
# docs/DEPLOYMENT_SINGLE_HOST.md, "Database roles and secrets"):
#   .env          everything web and worker need, with DATABASE_URL for the hks_app role only
#   migrate.env   DATABASE_MIGRATION_URL (the owner role), read by the migrate job only
#   postgres.env  the superuser, owner and application passwords, read by ks-postgres only
# migrate.env and postgres.env are optional so that a host that still keeps those values in
# .env keeps working; once they are moved, web and worker no longer receive them.
#
# The host's ports 80 and 443 belong to the reverse proxy of the other product. This stack
# publishes no port. Its web container joins that proxy's network under the alias
# `knowledge-studio-web`, and the proxy routes the subdomain to it (see Caddyfile.snippet).
name: knowledge-studio

x-app: &app
  image: ghcr.io/${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY, lowercase owner/repo}/app:${IMAGE_TAG:?set IMAGE_TAG}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # Every long-running service carries a `ks-` prefix on purpose. The web container also
  # sits on the reverse proxy's network, where the other product has services named
  # `postgres`, `redis` and `web`. With the plain names the web container resolved the other
  # product's database and Redis, and Docker registered this stack's web container under the
  # extra alias `web` on the proxy's network, so the proxy sometimes sent the other product's
  # traffic here. Never give a service here a name that exists in the other stack.
  ks-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # POSTGRES_PASSWORD, HKS_OWNER_PASSWORD and HKS_APP_PASSWORD, read only when the data volume
    # is first created (postgres-init.sh). A new host needs the file; an existing volume does not.
    env_file:
      - path: postgres.env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hks"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  ks-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  migrate:
    <<: *app
    # The only application container that receives the owner role.
    env_file:
      - path: .env
      - path: migrate.env
        required: false
    restart: "no"
    command: ["pnpm", "db:migrate"]
    depends_on:
      ks-postgres: { condition: service_healthy }

  ks-web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
      ks-redis: { condition: service_healthy }
    healthcheck:
      # /api/health answers 200 only when PostgreSQL and Redis are reachable. An image from before
      # that endpoint existed answers 404, and the older demo endpoint is asked instead.
      test: ["CMD", "node", "-e", "const u='http://127.0.0.1:3000/api/';fetch(u+'health').then(r=>r.status===404?fetch(u+'v1/demo'):r).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      default:
      edge:
        aliases: [knowledge-studio-web]
    mem_limit: 768m

  ks-worker:
    <<: *app
    command: ["pnpm", "--filter", "@hks/worker", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      ks-redis: { condition: service_healthy }
    mem_limit: 640m
    # The worker has no port. It rewrites a heartbeat file while it runs and Redis answers;
    # the check fails when the file is missing or older than 90 seconds.
    healthcheck:
      test: ["CMD", "node", "-e", "const f=process.env.WORKER_HEARTBEAT_FILE||require('os').tmpdir()+'/hks-worker-heartbeat';process.exit(Date.now()-require('fs').statSync(f).mtimeMs<90000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?set EDGE_NETWORK to the reverse proxy's Docker network}

volumes:
  postgres-data:
  redis-data:
